[project]
name = "ide-platform-api"
version = "0.1.0"
description = "FastAPI orchestrator for Next.js web IDE + MCP + OpenAI + OIDC + MySQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "SQLAlchemy>=2.0.30",
  "PyMySQL>=1.1.1",
  "alembic>=1.13.0",
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "authlib>=1.3.2",
  "itsdangerous>=2.2.0",
  "python-jose[cryptography]>=3.3.0",
  "openai>=1.40.0",
  "boto3>=1.34.0",
  "mcp>=1.2.0",
  "anyio>=4.4.0",
  "orjson>=3.10.0",
]

[project.scripts]
ide-api = "ide_platform_api.main:run"

[build-system]
requires = ["hatchling>=1.22.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ide_platform_api"]
